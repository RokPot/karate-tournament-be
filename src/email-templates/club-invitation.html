<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Club invitation</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      Brevo transactional params:
        params.firstName       string
        params.clubName        string
        params.expiresInDays   number | string  (e.g. 7)
        params.acceptUrl       string           (absolute invite URL)
    -->
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f8f7f4;
      font-family: Roboto, Arial, Helvetica, sans-serif;
      color: #1c1c1e;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f8f7f4; margin: 0; padding: 0"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              max-width: 560px;
              background-color: #ffffff;
              border: 1px solid #ebeae6;
              border-collapse: separate;
              border-radius: 8px;
              overflow: hidden;
            "
          >
            <!-- Brand strip -->
            <tr>
              <td
                style="
                  height: 4px;
                  line-height: 4px;
                  font-size: 0;
                  background-color: #5c481c;
                "
              >
                &nbsp;
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 32px 28px 28px 28px">
                <p
                  style="
                    margin: 0 0 16px 0;
                    font-size: 16px;
                    line-height: 1.5;
                    font-weight: 400;
                    color: #1c1c1e;
                  "
                >
                  Hi {{ params.firstName }},
                </p>

                <p
                  style="
                    margin: 0 0 12px 0;
                    font-size: 16px;
                    line-height: 1.5;
                    font-weight: 400;
                    color: #1c1c1e;
                  "
                >
                  You have been invited to join
                  <strong style="font-weight: 500">{{ params.clubName }}</strong>
                  on Karate App.
                </p>

                <p
                  style="
                    margin: 0 0 28px 0;
                    font-size: 16px;
                    line-height: 1.5;
                    font-weight: 400;
                    color: #1c1c1e;
                  "
                >
                  This invitation expires in {{ params.expiresInDays }} days.
                </p>

                <!-- CTA -->
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="margin: 0 0 24px 0"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#B8963E"
                      style="
                        background-color: #b8963e;
                        border-radius: 6px;
                        mso-padding-alt: 12px 24px;
                      "
                    >
                      <a
                        href="{{ params.acceptUrl }}"
                        target="_blank"
                        rel="noopener noreferrer"
                        style="
                          display: inline-block;
                          padding: 12px 24px;
                          font-family: Roboto, Arial, Helvetica, sans-serif;
                          font-size: 16px;
                          font-weight: 500;
                          line-height: 1.25;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 6px;
                        "
                      >
                        Accept invitation
                      </a>
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    margin: 0 0 8px 0;
                    font-size: 14px;
                    line-height: 1.5;
                    font-weight: 400;
                    color: #6b7280;
                  "
                >
                  If the button does not work, open this link:
                </p>

                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    line-height: 1.5;
                    font-weight: 400;
                    word-break: break-all;
                  "
                >
                  <a
                    href="{{ params.acceptUrl }}"
                    target="_blank"
                    rel="noopener noreferrer"
                    style="color: #b8963e; text-decoration: underline"
                  >
                    {{ params.acceptUrl }}
                  </a>
                </p>

                <!-- Footer -->
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="width: 100%; margin-top: 28px"
                >
                  <tr>
                    <td
                      style="
                        border-top: 1px solid #ebeae6;
                        padding-top: 16px;
                        font-size: 13px;
                        line-height: 1.4;
                        color: #6b7280;
                      "
                    >
                      Karate App
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

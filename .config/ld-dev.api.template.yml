## Configuration for STAGE=orion-api-dev
##  - orion-api-dev.api.template.yml is commited to git and uses ${} functions
##  - orion-api-dev.api.resolved.yml is generated on "yarn bootstrap --stage orion-api-dev"
##  - orion-api-dev.api.override.yml can be used for local overrides

core:
  stage: ${func:stage}
  release: ${func:release}
  buildAt: ${env:BUILD_TIMESTAMP}
  service: lossdog-be
http:
  openapi:
    mode: runtime
    path: docs
    title: Lossdog Backend
    description: Lossdog Backend
    username: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/swagger/username}
    password: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/swagger/password}
  port: ${env:PORT}
  host: 0.0.0.0
  log: true
  validateResponse: warn
  cors:
    origin: ['^https?://localhost:3000$', '^https?://([^.]+\.)*lossdog\.com$']
  pagination:
    limitMin: 1
    limitMax: 100
    limitDefault: 10


logger:
  output: json
  level: debug
  contexts:
    Bootstrap: warn
    HttpException: warn
    ExceptionHandler: debug
    RoutesResolver: warn
    RouterExplorer: warn
    NestApplication: warn
    SocketIOService: log
    SocketGateway: warn
    PdfExtractionService: warn
    AuthnService: debug
  sentry:
    dsn: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/sentry/dsn}
    level: error
    profilesSampleRate: 0.1
    tracesSampleRate: 0.1
    sampleRate: 0.1
    contexts:
      Bootstrap: none
      HttpException: error
      ExceptionHandler: error
      RoutesResolver: none
      RouterExplorer: none
      NestApplication: none
      SocketIOService: warn

database:
  url: ${env:DATABASE_URL}
  ssl: true
  synchronize: false
  autoMigrate: true
  logging: false

auth0:
  domain: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/auth0/domain}
  clientId: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/auth0/client-id}
  clientSecret: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/auth0/client-secret}
  audience: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/auth0/audience}

websocket:
  socketio:
    serverUrl: http://${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/redis/address}

fred:
  stlouis:
    apiKey: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/stlouis-fred/api-key}
    baseUrl: 'https://api.stlouisfed.org/fred'

bls:
  api:
    apiKey: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/bls/api-key}
    baseUrl: 'https://api.bls.gov'

automationTesting:
  enableAutomationEndpoints: true
  allowedDomains:
    - playwright-testing.com
  allowedEmails:
    - astrit.zeqiri@povio.com
    - admin@lossdog.com

personas:
  defaultPassword: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/personas/defaultPassword}


stripe:
  enabled: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/stripe/enabled}
  secretKey: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/stripe/secret-key}
  webhookSecret: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/stripe/webhook-secret}

userSubscription:
  paywallEnabled: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/user-subscription/paywall-enabled}
  premiumProductId: ${arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/user-subscription/premium-product-id}

worthCalculation:
  alternativeRunEnabled: true

app:
  business:
    baseUrl: https://biz.dev.lossdog.com
  individuals:
    baseUrl: https://dev.lossdog.com

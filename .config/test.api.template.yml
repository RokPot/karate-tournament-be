## Configuration for STAGE=test
##  Read at runtime from this file. Set STAGE=test. No bootstrap step.

core:
  stage: test
  release: ${env:RELEASE}
  webBaseUrl: 'http://localhost:8000'
  apiBaseUrl: 'http://localhost:3000'
  service: karate-app

http:
  log: true
  port: 3000
  host: 0.0.0.0
  validateResponse: throw
  cors:
    origin: true
    maxAge: 3600
  openapi:
    mode: disabled
    title: Karate App
    description: Karate App
    username: admin
    password: admin

logger:
  output: console
  # limit output from tests
  level: verbose

database:
  host: localhost
  port: 5433
  database: tournament-app-test
  username: admin
  password: admin
  ssl: false
  synchronize: false
  autoMigrate: false
  logging: false

invitation:
  frontendBaseUrl: 'http://localhost:8000'

auth0:
  domain: your-tenant.auth0.com
  clientId: test-client-id
  clientSecret: test-client-secret
  audience: https://api.tournament-app.com

# ECS Deploy configuration file
# @see https://github.com/povio/ecs-deploy-cli/tree/v4?tab=readme-ov-file#configure

accountId: '872515261725'
region: us-east-1
clusterName: ld-dev

# build and upload to ecr with `ecs-deploy build main --stage myapp-dev`
build:
  - name: main
    repoName: ld-dev
    platform: linux/amd64
    environmentValues:
      - name: RELEASE
        valueFrom: "func:release"
      - name: VITE_API_BASE_URL
        valueFrom: "arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/vite/api-base-url"

# deploy to ecs with `ecs-deploy deploy --stage myapp-dev`
taskDefinition:
  - name: api
    taskFamily: ld-dev-api
    serviceName: ld-dev-api
    template: arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api/task-definition
    containerDefinitions:
      - name: main
        image: main
        environmentValues:
          - name: TEMPORAL_ADDRESS
            value: "temporal-api.dev.lossdog.com:7233"
          - name: TEMPORAL_NAMESPACE
            value: "default"
  - name: worker
    taskFamily: ld-dev-api-worker
    serviceName: ld-dev-api-worker
    template: arn:aws:ssm:us-east-1:872515261725:parameter/ld-dev/api-worker/task-definition
    containerDefinitions:
      - name: main
        image: main
        environmentValues:
          - name: RUN_MODE
            value: "worker"
          - name: TEMPORAL_ADDRESS
            value: "temporal-api.dev.lossdog.com:7233"
          - name: TEMPORAL_NAMESPACE
            value: "default"

configs:
  - name: api
    destination: ./.config/ld-dev.api.resolved.yml
    values:
      - name: '@'
        configFrom: api.template
  - name: worker
    destination: ./.config/ld-dev.worker.resolved.yml
    values:
      - name: '@'
        configFrom: api.template

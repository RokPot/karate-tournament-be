## Configuration for STAGE=local
##  Read at runtime from this file. Optional: local.api.override.yml (gitignored).
##  Set STAGE=local (the default). No bootstrap step.

core:
  stage: local
  release: ${env:RELEASE}
  webBaseUrl: 'http://localhost:3000'
  apiBaseUrl: 'http://localhost:3002'
  service: karate-app

http:
  log: true
  port: 3002
  host: 0.0.0.0
  validateResponse: warn
  cors:
    origin: true
    maxAge: 3600
  openapi:
    mode: runtime
    path: docs
    title: Karate App
    description: Karate App
    username: admin
    password: admin
  pagination:
    limitMin: 1
    limitMax: 100
    limitDefault: 10

logger:
  output: console
  level: debug # default log level
  contexts:
    # per context log level
    InstanceLoader: warn
    RouterExplorer: warn
    HttpException: log
    SocketIOService: debug
    AuthnService: log
  sentry:
    dsn: false
    level: error
    contexts:
      Bootstrap: none
      HttpException: error
      ExceptionHandler: error
      RoutesResolver: none
      RouterExplorer: none
      NestApplication: none
      SocketIOService: warn

database:
  host: localhost
  port: 5432
  database: tournament-app
  username: admin
  password: admin
  ssl: false
  synchronize: false
  autoMigrate: false
  logging: true

invitation:
  frontendBaseUrl: 'http://localhost:3000'

auth0:
  domain: dev-roky.eu.auth0.com
  clientId: JIZIYl0F3z7rARQZ92Wc3ySg2KFyS1gx
  clientSecret: XXX
  audience: https://api.tournament-app.com
  # jwksTlsInsecure: true

websocket:
  socketio:
    serverUrl: http://localhost:6379

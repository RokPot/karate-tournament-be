## Configuration for STAGE=railway (Railway deploy)
##  All secrets and URLs come from Railway env vars (no bootstrap).
##
##  In Railway dashboard set:
##    STAGE=railway
##    DATABASE_URL=postgresql://...   (Railway Postgres provides this)
##    AUTH0_DOMAIN=your-tenant.auth0.com
##    AUTH0_CLIENT_ID=...
##    AUTH0_CLIENT_SECRET=...
##    AUTH0_AUDIENCE=https://api.your-app.com
##  Optional: WEB_BASE_URL, API_BASE_URL, RELEASE, WEBSOCKET_SERVER_URL
##  Mail (Brevo): prefer HTTPS API on Railway (SMTP ports are often blocked):
##    BREVO_API_KEY, BREVO_SMTP_FROM
##  Optional SMTP fallback: BREVO_SMTP_USER, BREVO_SMTP_KEY
##  PORT is set automatically by Railway.

core:
  stage: railway
  release: ${env:RELEASE}
  webBaseUrl: ${env:WEB_BASE_URL}
  apiBaseUrl: ${env:API_BASE_URL}
  service: karate-app

http:
  log: true
  port: ${env:PORT}
  host: 0.0.0.0
  validateResponse: warn
  cors:
    origin: true
    maxAge: 3600
  openapi:
    mode: runtime
    path: docs
    title: Karate App
    description: Karate App
    username: admin
    password: admin
  pagination:
    limitMin: 1
    limitMax: 100
    limitDefault: 10

logger:
  output: json
  level: debug
  contexts:
    InstanceLoader: warn
    RouterExplorer: warn
  sentry:
    dsn: false
    level: error

database:
  url: ${env:DATABASE_URL}
  ssl: true
  synchronize: false
  autoMigrate: true
  logging: false

invitation:
  frontendBaseUrl: ${env:WEB_BASE_URL}

mail:
  enabled: true
  host: smtp-relay.brevo.com
  port: 587
  # Prefer API key on Railway — outbound SMTP (587) often times out.
  apiKey: ${env:BREVO_API_KEY}
  user: ${env:BREVO_SMTP_USER}
  password: ${env:BREVO_SMTP_KEY}
  from: ${env:BREVO_SMTP_FROM}
  tlsInsecure: false

auth0:
  domain: ${env:AUTH0_DOMAIN}
  clientId: ${env:AUTH0_CLIENT_ID}
  clientSecret: ${env:AUTH0_CLIENT_SECRET}
  audience: ${env:AUTH0_AUDIENCE}

websocket:
  socketio:
    serverUrl: ${env:WEBSOCKET_SERVER_URL}

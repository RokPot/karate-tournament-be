project:
  name: lossdog-be
  title: LossDog Backend
  description: LossDog Backend

~common/logger:
  # basic, pino, sentry, highlight
  provider: sentry

dot-config:
  bootstrap: false

# AWS ECS Deploy Cli
ecs-deploy-cli:
  bootstrap: true
  mode: enabled
  #stages:
  #  - lossdog-be-dev

~database/prisma:
  mode: enabled
  autoMigrate: true
  autoSeed: true

~common/http/openapi:
  # disabled, static, runtime
  mode: runtime
  # served on /docs-json
  path: docs

~common/email:
  mode: enabled
  # sendgrid, aws-ses
  provider: aws-ses

~common/authn:
  mode: enabled
  providers:
    - local
    # - auth0
    # - google

~common/queues:
  mode: enabled
  # pg-boss, hotwire
  provider: pg-boss

~common/media:
  mode: enabled
  # aws-s3, prisma
  providers:
   - aws-s3
